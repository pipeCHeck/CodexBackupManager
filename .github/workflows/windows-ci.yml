name: Windows CI

on:
  push:
  pull_request:

# 최소 권한 — 이 workflow는 checkout/build/test/publish-artifact만 하고, 저장소 내용을 쓰거나
# GitHub Release/Tag를 만들지 않는다.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet restore
        run: dotnet restore CodexBackupManager.sln

      - name: dotnet build (Release)
        run: dotnet build CodexBackupManager.sln -c Release --no-restore

      # Domain/Codex/Backup/Restore.Tests(CrashSim 자식 프로세스 강제 종료 포함)/App.Tests(WPF)까지
      # 전부 이 한 번의 호출로 실행된다 — CodexBackupManager.sln에 포함된 모든 테스트 프로젝트.
      - name: dotnet test (Release)
        run: dotnet test CodexBackupManager.sln -c Release --no-build --logger "console;verbosity=normal"

  # Phase 08_07/08_08 — 실제 배포 형태(self-contained **폴더형**, Phase 08_07부터 single-file이
  # 아니다)가 CI에서도 문제없이 만들어지는지 확인하는 별도 job. 이 job은 GitHub Release/Tag를
  # 만들지 않는다 — 결과물을 워크플로 아티팩트로만 남긴다. dotnet publish 옵션을 이 workflow에
  # 직접 하드코딩하지 않고 scripts/publish-release.ps1(배포 규격의 single source of truth)을
  # 그대로 호출한다 — 두 곳이 서로 다른 옵션으로 어긋나는 일을 막기 위함이다. -SkipTests는 직전
  # build-and-test job이 이미 전체 솔루션 Release 테스트를 통과한 뒤에만 실행되므로(needs) 이
  # job에서만 허용한다 — 로컬에서 최종 release를 만들 때는 -SkipTests 없이 실행해야 한다.
  package-release:
    name: Package self-contained folder (win-x64)
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run scripts/publish-release.ps1 (-SkipTests)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-release.ps1 -SkipTests

      - name: Upload release ZIP + SHA256SUMS as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBackupManager-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
